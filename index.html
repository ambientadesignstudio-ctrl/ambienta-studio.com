    <template id="tpl-about">
      <div class="panel-text">
        <div class="panel-block">
          <p class="panel-en">
            Graphic designer and artist. Born in 1992.
            Graduated from Musashino Art University.
            Working across graphic design and illustration,
            with a practice spanning visual identity,
            printed matter, and photographic expression.
            Under the theme “Life in nonsense,”
            the work explores subtle irregularities
            and quiet beauty found in everyday life
            as points of departure for creation.
            Founder of Ambienta.
            Beginning with the operation of an antique shop,
            the practice has expanded into spatial design,
            products, and graphic work,
            developing into a broader design-based activity.
          </p>

          <p class="panel-ja">
            グラフィックデザイナー、アーティスト。
            1992年生まれ。武蔵野美術大学卒業。
            グラフィックデザインとイラストレーションを軸に、
            ビジュアルアイデンティティ、印刷物、
            写真表現などを横断しながら活動している。
            「ノンセンスの中にある生活」をテーマに、
            日常の中に潜む違和感や美しさを
            手がかりに制作を行う。
            <span class="latin">Ambienta.</span> 主宰。
            古道具屋としての活動を起点に、
            空間、プロダクト、グラフィックへと
            領域を広げながら、
            デザイン業務へと発展させている。
          </p>
        </div>
      </div>
    </template>
